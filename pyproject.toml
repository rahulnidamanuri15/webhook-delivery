[project]
name = "webhook-delivery"
version = "0.1.0"
description = "Reliable Webhook Delivery Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "itsdangerous>=2.1.2",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "pytest>=8.0.0",
    "psycopg[binary]>=3.1.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.testclient.StarletteDeprecationWarning"
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "node_modules", "__pycache__", "app/static/css/dist.css"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E702", "E712", "E402", "F841", "F401"]

[tool.black]
line-length = 120
exclude = "app/static/css/dist.css"
