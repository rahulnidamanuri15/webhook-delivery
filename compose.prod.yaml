# Production overlay: strict, fail-closed.
# Usage:
#   ENV=production SECRET_KEY=... SIGNING_SECRET_ENCRYPTION_KEY=... \
#   API_KEY_PEPPER=... METRICS_API_KEY=... POSTGRES_PASSWORD=... \
#   REDIS_PASSWORD=... REDIS_URL=redis://:REDIS_PASSWORD@redis:6379/0 \
#   ALLOWED_RECEIVER_DOMAINS=merchant.example.com \
#   docker compose -f compose.yaml -f compose.prod.yaml up --build
#
# Requires all secrets (no dev defaults). app/config.py fail-fasts if
# placeholders or weak values remain. Demo seed / demo_receiver are
# excluded by default (profiles in base file).
name: webhook-delivery-prod

services:
  postgres:
    ports: []  # never expose DB publicly in prod; app network only
    mem_limit: 1g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}

  redis:
    ports: []
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}

  web:
    # Never expose :8080 directly in prod — traffic must go via reverse_proxy (:80/:443).
    ports: []
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - ENV=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required in production}
      - SIGNING_SECRET_ENCRYPTION_KEY=${SIGNING_SECRET_ENCRYPTION_KEY:?SIGNING_SECRET_ENCRYPTION_KEY is required in production}
      - API_KEY_PEPPER=${API_KEY_PEPPER:?API_KEY_PEPPER is required in production}
      - METRICS_API_KEY=${METRICS_API_KEY:?METRICS_API_KEY is required in production}
      - REDIS_URL=${REDIS_URL:?REDIS_URL with password is required, e.g. redis://:pass@redis:6379/0}
      - ALLOW_LOCAL_RECEIVERS=False
      - ALLOWED_RECEIVER_DOMAINS=${ALLOWED_RECEIVER_DOMAINS:?ALLOWED_RECEIVER_DOMAINS is required in production}
      - USE_CELERY=True
      - ENABLE_INPROCESS_DISPATCHER=False
      - USE_DEMO_RETRY_POLICY=False
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

  celery_worker:
    mem_limit: 1g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - ENV=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required in production}
      - SIGNING_SECRET_ENCRYPTION_KEY=${SIGNING_SECRET_ENCRYPTION_KEY:?SIGNING_SECRET_ENCRYPTION_KEY is required in production}
      - API_KEY_PEPPER=${API_KEY_PEPPER:?API_KEY_PEPPER is required in production}
      - METRICS_API_KEY=${METRICS_API_KEY:?METRICS_API_KEY is required in production}
      - REDIS_URL=${REDIS_URL:?REDIS_URL with password is required}
      - ALLOW_LOCAL_RECEIVERS=False
      - ALLOWED_RECEIVER_DOMAINS=${ALLOWED_RECEIVER_DOMAINS:?ALLOWED_RECEIVER_DOMAINS is required in production}
      - USE_DEMO_RETRY_POLICY=False
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

  celery_beat:
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - ENV=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required in production}
      - SIGNING_SECRET_ENCRYPTION_KEY=${SIGNING_SECRET_ENCRYPTION_KEY:?SIGNING_SECRET_ENCRYPTION_KEY is required in production}
      - API_KEY_PEPPER=${API_KEY_PEPPER:?API_KEY_PEPPER is required in production}
      - REDIS_URL=${REDIS_URL:?REDIS_URL with password is required}
      - USE_DEMO_RETRY_POLICY=False
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

  # Fail-closed if accidentally enabled in prod: force production env + secrets
  # so placeholder defaults can never run against the prod DB.
  dispatcher:
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - ENV=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required in production}
      - SIGNING_SECRET_ENCRYPTION_KEY=${SIGNING_SECRET_ENCRYPTION_KEY:?SIGNING_SECRET_ENCRYPTION_KEY is required in production}
      - API_KEY_PEPPER=${API_KEY_PEPPER:?API_KEY_PEPPER is required in production}
      - REDIS_URL=${REDIS_URL:?REDIS_URL with password is required}
      - ALLOW_LOCAL_RECEIVERS=False
      - ALLOWED_RECEIVER_DOMAINS=${ALLOWED_RECEIVER_DOMAINS:?ALLOWED_RECEIVER_DOMAINS is required in production}
      - USE_DEMO_RETRY_POLICY=False

  seed:
    environment:
      - ENV=${ENV:?ENV must be explicitly set to run seed (refuses production in scripts/seed.py)}

  reverse_proxy:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
