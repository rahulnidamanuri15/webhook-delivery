name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webhook_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/webhook_platform_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci_secret_key_testing_only_1234567890_super_safe
      SIGNING_SECRET_ENCRYPTION_KEY: yFz8s0v81v3G-xG3hV48V7s9uY5pL0tM2wN4bQ6rE8A=
      API_KEY_PEPPER: ci_pepper_testing_only_1234567890
      METRICS_API_KEY: ci_metrics_testing_only_1234567890
      ALLOW_LOCAL_RECEIVERS: "true"
      DEBUG: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install -e .
          pip install pytest psycopg[binary] redis ruff black

      - name: Lint (ruff + black check)
        run: |
          ruff check app demo_receiver tests scripts benchmarks
          black --check app demo_receiver tests scripts benchmarks

      - name: Secret scan check
        run: |
          python -c '
          import os, sys, re
          patterns = [
              r"-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----",
          ]
          violations = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", ".venv", "node_modules", "__pycache__", ".pytest_cache")]
              for f in files:
                  if f.endswith((".py", ".yaml", ".yml")):
                      p = os.path.join(root, f)
                      with open(p, "r", encoding="utf-8", errors="ignore") as fh:
                          for i, line in enumerate(fh, 1):
                              for pat in patterns:
                                  if re.search(pat, line):
                                      violations.append(f"{p}:{i}")
          if violations:
              print("Committed private key violations found:\n" + "\n".join(violations))
              sys.exit(1)
          print("Secret scanning passed.")
          '


      - name: Run database migrations (PostgreSQL)
        run: |
          alembic upgrade head

      - name: Run test suite (PostgreSQL + Redis)
        run: |
          pytest -v --tb=short

      - name: Set up Node for Tailwind build
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build production CSS
        run: |
          npm ci --no-audit --no-fund
          npm run build:css
          test -f app/static/css/dist.css
