name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webhook_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/webhook_platform_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci_secret_key_testing_only_1234567890_super_safe
      SIGNING_SECRET_ENCRYPTION_KEY: yFz8s0v81v3G-xG3hV48V7s9uY5pL0tM2wN4bQ6rE8A=
      API_KEY_PEPPER: ci_pepper_testing_only_1234567890
      METRICS_API_KEY: ci_metrics_testing_only_1234567890
      ALLOW_LOCAL_RECEIVERS: "true"
      DEBUG: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install -e .
          pip install pytest psycopg[binary] redis ruff black

      - name: Lint (ruff + black check)
        run: |
          ruff check app demo_receiver tests scripts benchmarks
          black --check app demo_receiver tests scripts benchmarks

      - name: Secret scan check
        run: |
          python -c '
          import os, sys, re
          content_patterns = [
              r"-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----",
              r"npg_[A-Za-z0-9_-]{10,}",
          ]
          violations = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", ".venv", "node_modules", "__pycache__", ".pytest_cache")]
              for f in files:
                  if f in (".env",) or f.endswith((".pem", ".key", ".py", ".yaml", ".yml")):
                      p = os.path.join(root, f)
                      with open(p, "r", encoding="utf-8", errors="ignore") as fh:
                          for i, line in enumerate(fh, 1):
                              for pat in content_patterns:
                                  if re.search(pat, line):
                                      violations.append(f"{p}:{i}")
          if violations:
              print("Committed secret violations found:\n" + "\n".join(violations))
              sys.exit(1)
          print("Secret scanning passed.")
          '


      - name: Run database migrations (PostgreSQL)
        run: |
          alembic upgrade head

      - name: Run test suite (PostgreSQL + Redis)
        run: |
          pytest -v --tb=short

      - name: Set up Node for Tailwind build
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build production CSS
        run: |
          npm ci --no-audit --no-fund
          npm run build:css
          test -f app/static/css/dist.css

  enforce-prod-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce production compose overlay (Makefile + wrapper + hardening)
        run: bash scripts/enforce_prod_compose.sh

      - name: Fail if production branch bypasses prod overlay
        run: |
          # Belt-and-braces: on production branches the overlay is mandatory.
          # The script above already validates hardening + render safety; this step
          # explicitly fails a production-branch build that sidesteps the overlay.
          case "${GITHUB_REF_NAME:-}" in
            main|master)
              echo "Production branch detected (${GITHUB_REF_NAME}); verifying overlay is mandatory..."
              grep -q "compose.prod.yaml" scripts/deploy_prod.sh || { echo "::error::deploy wrapper must reference compose.prod.yaml"; exit 1; }
              grep -q "compose.prod.yaml" Makefile || { echo "::error::Makefile prod targets must reference compose.prod.yaml"; exit 1; }
              if [ -n "${COMPOSE_FILE:-}" ]; then
                case "${COMPOSE_FILE}" in
                  *compose.prod.yaml*) echo "COMPOSE_FILE includes prod overlay: ${COMPOSE_FILE}" ;;
                  *) echo "::error::COMPOSE_FILE on production branch must include compose.prod.yaml (got: ${COMPOSE_FILE})"; exit 1 ;;
                esac
              fi
              # A bare base-file render must NOT be prod-safe; otherwise the guard is moot.
              if docker compose -f compose.yaml config 2>/dev/null | grep -q 'published: "5432"'; then
                echo "Confirmed: bare compose.yaml exposes DB ports, so the overlay is load-bearing."
              else
                echo "::error::bare compose.yaml no longer exposes DB ports; enforcement assumptions changed."
                exit 1
              fi
              ;;
            *)
              echo "Non-production ref (${GITHUB_REF_NAME:-unknown}); overlay enforcement still validated by script above."
              ;;
          esac

  validate-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate prod compose overlay (dry-run with dummy secrets)
        run: |
          ENV=development \
          SECRET_KEY=dummy_secret_key_for_config_check_only_1234567890 \
          SIGNING_SECRET_ENCRYPTION_KEY=yFz8s0v81v3G-xG3hV48V7s9uY5pL0tM2wN4bQ6rE8A= \
          API_KEY_PEPPER=dummy_pepper_for_config_check \
          METRICS_API_KEY=dummy_metrics_key_for_check \
          POSTGRES_PASSWORD=dummy_postgres_password \
          REDIS_PASSWORD=dummy_redis_password \
          REDIS_URL=redis://:dummy@redis:6379/0 \
          ALLOWED_RECEIVER_DOMAINS=example.com \
          PUBLIC_BASE_URL=https://example.com \
          SMTP_HOST=smtp.example.com \
          SMTP_PASSWORD=dummy_smtp_password \
          SMTP_FROM_EMAIL=noreply@example.com \
          docker compose -f compose.yaml -f compose.prod.yaml config -q

      - name: Build production image
        run: docker build -t webhook-delivery:ci .
