services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: webhook_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: webhook_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    image: webhook-delivery:latest
    container_name: webhook_web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@postgres:5432/webhook_platform
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=True
      - ENABLE_INPROCESS_DISPATCHER=False
      - SECRET_KEY=wh_dev_insecure_secret_key_change_in_production_1234567890
      - SIGNING_SECRET_ENCRYPTION_KEY=yFz8s0v81v3G-xG3hV48V7s9uY5pL0tM2wN4bQ6rE8A=
      - ALLOW_LOCAL_RECEIVERS=True
      - ALLOWED_RECEIVER_DOMAINS=${ALLOWED_RECEIVER_DOMAINS:-}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-90}
      - HTTP_CONNECT_TIMEOUT_SECONDS=${HTTP_CONNECT_TIMEOUT_SECONDS:-3.0}
      - DISPATCH_MAX_WORKERS=${DISPATCH_MAX_WORKERS:-10}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - DEBUG=False
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080"

  dispatcher:
    image: webhook-delivery:latest
    container_name: webhook_dispatcher
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@postgres:5432/webhook_platform
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=True
      - ENABLE_INPROCESS_DISPATCHER=False
      - SECRET_KEY=wh_dev_insecure_secret_key_change_in_production_1234567890
      - SIGNING_SECRET_ENCRYPTION_KEY=yFz8s0v81v3G-xG3hV48V7s9uY5pL0tM2wN4bQ6rE8A=
      - ALLOW_LOCAL_RECEIVERS=True
      - ALLOWED_RECEIVER_DOMAINS=${ALLOWED_RECEIVER_DOMAINS:-}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-90}
      - HTTP_CONNECT_TIMEOUT_SECONDS=${HTTP_CONNECT_TIMEOUT_SECONDS:-3.0}
      - DISPATCH_MAX_WORKERS=${DISPATCH_MAX_WORKERS:-10}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: python -m app.workers.runner

  celery_worker:
    image: webhook-delivery:latest
    container_name: webhook_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@postgres:5432/webhook_platform
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=True
      - SECRET_KEY=wh_dev_insecure_secret_key_change_in_production_1234567890
      - SIGNING_SECRET_ENCRYPTION_KEY=yFz8s0v81v3G-xG3hV48V7s9uY5pL0tM2wN4bQ6rE8A=
      - ALLOW_LOCAL_RECEIVERS=True
      - ALLOWED_RECEIVER_DOMAINS=${ALLOWED_RECEIVER_DOMAINS:-}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-90}
      - HTTP_CONNECT_TIMEOUT_SECONDS=${HTTP_CONNECT_TIMEOUT_SECONDS:-3.0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -c 4

  celery_beat:
    image: webhook-delivery:latest
    container_name: webhook_beat
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@postgres:5432/webhook_platform
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=True
      - SECRET_KEY=wh_dev_insecure_secret_key_change_in_production_1234567890
      - SIGNING_SECRET_ENCRYPTION_KEY=yFz8s0v81v3G-xG3hV48V7s9uY5pL0tM2wN4bQ6rE8A=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info

  demo_receiver:
    image: webhook-delivery:latest
    container_name: webhook_demo_receiver
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DEMO_RECEIVER_ADMIN_TOKEN=${DEMO_RECEIVER_ADMIN_TOKEN:-}
      - DEMO_RECEIVER_ENDPOINT_SECRET=${DEMO_RECEIVER_ENDPOINT_SECRET:-whsec_demosecret1234567890abcdef}
      - DEMO_RECEIVER_DB_FILE=/app/demo_receiver/demo_receiver.db
    volumes:
      - ./demo_receiver:/app/demo_receiver
    command: uvicorn demo_receiver.app:app --host 0.0.0.0 --port 8001

  # Single-host production entrypoint: TLS termination + header hardening.
  # HTTP on :80 always works. For HTTPS, place certs in ./deploy/tls/ and
  # uncomment the 443 block in deploy/nginx.conf, then expose 443 below.
  reverse_proxy:
    image: nginx:1.27-alpine
    container_name: webhook_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/tls:/etc/nginx/tls:ro
    depends_on:
      - web

volumes:
  pgdata:
