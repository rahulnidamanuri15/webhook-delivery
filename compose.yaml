# Base compose: local development defaults (insecure placeholders allowed).
# Production: use `docker compose -f compose.yaml -f compose.prod.yaml up`
# with real secrets in environment / Vault. compose.prod.yaml enforces
# ENV=production, strong secrets, no demo seed, no demo_receiver.
# app/config.py also fail-fasts in ENV=production on placeholders.
services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword_dev_only_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-webhook_platform}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: webhook_redis
    restart: unless-stopped
    command: sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes; else exec redis-server --appendonly yes; fi'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: webhook-delivery:latest
    container_name: webhook_web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword_dev_only_change_in_prod}@postgres:5432/${POSTGRES_DB:-webhook_platform}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - USE_CELERY=True
      - ENABLE_INPROCESS_DISPATCHER=False
      - ENV=${ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-wh_dev_insecure_secret_key_change_in_production_1234567890}
      - SIGNING_SECRET_ENCRYPTION_KEY=${SIGNING_SECRET_ENCRYPTION_KEY:-yFz8s0v81v3G-xG3hV48V7s9uY5pL0tM2wN4bQ6rE8A=}
      - API_KEY_PEPPER=${API_KEY_PEPPER:-}
      - METRICS_API_KEY=${METRICS_API_KEY:-}
      - ALLOW_LOCAL_RECEIVERS=${ALLOW_LOCAL_RECEIVERS:-False}
      - ALLOWED_RECEIVER_DOMAINS=${ALLOWED_RECEIVER_DOMAINS:-}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-90}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-365}
      - HTTP_CONNECT_TIMEOUT_SECONDS=${HTTP_CONNECT_TIMEOUT_SECONDS:-3.0}
      - DISPATCH_MAX_WORKERS=${DISPATCH_MAX_WORKERS:-10}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - DEBUG=False
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # NOTE: migrations only. Seeding is an explicit one-shot service below
    # (`docker compose --profile seed run seed`) — never auto-run in prod.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080"

  # One-shot demo seed (dev only). Never started automatically.
  # Usage: docker compose --profile seed run --rm seed
  seed:
    image: webhook-delivery:latest
    profiles: ["seed"]
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword_dev_only_change_in_prod}@postgres:5432/${POSTGRES_DB:-webhook_platform}
      - SECRET_KEY=${SECRET_KEY:-wh_dev_insecure_secret_key_change_in_production_1234567890}
      - SIGNING_SECRET_ENCRYPTION_KEY=${SIGNING_SECRET_ENCRYPTION_KEY:-yFz8s0v81v3G-xG3hV48V7s9uY5pL0tM2wN4bQ6rE8A=}
      - API_KEY_PEPPER=${API_KEY_PEPPER:-}
      - ENV=${ENV:-development}
      - SEED_API_KEY=${SEED_API_KEY:-}
      - SEED_ENDPOINT_SECRET=${SEED_ENDPOINT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python scripts/seed.py"

  # Standalone dispatcher loop (non-Celery mode only).
  # Prod with USE_CELERY=True uses celery_beat for dispatch — do NOT run
  # this alongside beat (duplicate enqueue). Enabled via profile.
  dispatcher:
    image: webhook-delivery:latest
    container_name: webhook_dispatcher
    profiles: ["standalone-dispatcher"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword_dev_only_change_in_prod}@postgres:5432/${POSTGRES_DB:-webhook_platform}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - USE_CELERY=False
      - ENABLE_INPROCESS_DISPATCHER=False
      - ENV=${ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-wh_dev_insecure_secret_key_change_in_production_1234567890}
      - SIGNING_SECRET_ENCRYPTION_KEY=${SIGNING_SECRET_ENCRYPTION_KEY:-yFz8s0v81v3G-xG3hV48V7s9uY5pL0tM2wN4bQ6rE8A=}
      - API_KEY_PEPPER=${API_KEY_PEPPER:-}
      - ALLOW_LOCAL_RECEIVERS=${ALLOW_LOCAL_RECEIVERS:-False}
      - ALLOWED_RECEIVER_DOMAINS=${ALLOWED_RECEIVER_DOMAINS:-}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-90}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-365}
      - HTTP_CONNECT_TIMEOUT_SECONDS=${HTTP_CONNECT_TIMEOUT_SECONDS:-3.0}
      - DISPATCH_MAX_WORKERS=${DISPATCH_MAX_WORKERS:-10}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.runner

  celery_worker:
    image: webhook-delivery:latest
    container_name: webhook_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword_dev_only_change_in_prod}@postgres:5432/${POSTGRES_DB:-webhook_platform}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - USE_CELERY=True
      - ENV=${ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-wh_dev_insecure_secret_key_change_in_production_1234567890}
      - SIGNING_SECRET_ENCRYPTION_KEY=${SIGNING_SECRET_ENCRYPTION_KEY:-yFz8s0v81v3G-xG3hV48V7s9uY5pL0tM2wN4bQ6rE8A=}
      - API_KEY_PEPPER=${API_KEY_PEPPER:-}
      - ALLOW_LOCAL_RECEIVERS=${ALLOW_LOCAL_RECEIVERS:-False}
      - ALLOWED_RECEIVER_DOMAINS=${ALLOWED_RECEIVER_DOMAINS:-}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-90}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-365}
      - HTTP_CONNECT_TIMEOUT_SECONDS=${HTTP_CONNECT_TIMEOUT_SECONDS:-3.0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -c 4

  celery_beat:
    image: webhook-delivery:latest
    container_name: webhook_beat
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword_dev_only_change_in_prod}@postgres:5432/${POSTGRES_DB:-webhook_platform}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - USE_CELERY=True
      - ENV=${ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-wh_dev_insecure_secret_key_change_in_production_1234567890}
      - SIGNING_SECRET_ENCRYPTION_KEY=${SIGNING_SECRET_ENCRYPTION_KEY:-yFz8s0v81v3G-xG3hV48V7s9uY5pL0tM2wN4bQ6rE8A=}
      - API_KEY_PEPPER=${API_KEY_PEPPER:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info --pidfile=/tmp/celerybeat.pid

  demo_receiver:
    image: webhook-delivery:latest
    container_name: webhook_demo_receiver
    profiles: ["demo"]
    restart: unless-stopped
    # Demo-only service: do not expose publicly without DEMO_RECEIVER_ADMIN_TOKEN.
    # Excluded from prod (compose.prod.yaml) — start explicitly for demos:
    #   docker compose --profile demo up demo_receiver
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - PORT=8001
      - DEMO_RECEIVER_ADMIN_TOKEN=${DEMO_RECEIVER_ADMIN_TOKEN:-}
      - DEMO_RECEIVER_ENDPOINT_SECRET=${DEMO_RECEIVER_ENDPOINT_SECRET:-whsec_demosecret_dev_only}
      - DEMO_RECEIVER_DB_FILE=/tmp/demo_receiver.db
    # No host bind-mount in prod (was ./demo_receiver:/app/demo_receiver).
    command: uvicorn demo_receiver.app:app --host 0.0.0.0 --port 8001

  # Single-host entrypoint: dev uses plain-HTTP proxy (nginx.dev.conf).
  # Prod overlay (compose.prod.yaml) swaps in deploy/nginx.conf with TLS.
  reverse_proxy:
    image: nginx:1.27-alpine
    container_name: webhook_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
