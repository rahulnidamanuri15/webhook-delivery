<!-- Sidebar Component -->
<div class="hidden md:flex md:w-64 md:flex-col md:fixed md:inset-y-0 bg-slate-900 border-r border-slate-800">
  <div class="flex-1 flex flex-col min-h-0">
    
    <!-- Brand Header -->
    <div class="flex items-center h-16 flex-shrink-0 px-6 bg-slate-950 border-b border-slate-800/80">
      <svg class="h-7 w-7 text-indigo-400 mr-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">

      <div class="flex items-center justify-between bg-slate-800/90 rounded-md px-3 py-2 text-sm text-white">

        <a href="/dashboard/projects" class="text-xs text-indigo-400 hover:text-indigo-300 ml-2">Switch</a>

    <div class="flex-shrink-0 flex items-center p-4 bg-slate-950 border-t border-slate-800">
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium text-white truncate">{{ current_user.email }}</p>
        <a href="/auth/logout" class="text-xs font-medium text-slate-400 hover:text-red-400 transition">Sign out</a>
      </div>
