<!DOCTYPE html>
<html lang="en" class="h-full bg-[#f4f6f3]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} · {{ title }} - Hookflow</title>
  <link rel="stylesheet" href="/static/css/dist.css">
</head>
<body class="h-full antialiased" style="font-family:'Inter',system-ui,sans-serif;">
  <div class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8" style="background:linear-gradient(180deg,#1e3227 0%,#15251d 100%)">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
      <span class="text-white font-bold text-2xl tracking-tight">Hook<span class="text-[#2fd180]">flow</span></span>
      <p class="mt-4 inline-flex items-center justify-center min-w-[64px] px-4 py-2 rounded-2xl bg-white/10 text-white font-extrabold text-3xl">{{ code }}</p>
      <h2 class="mt-3 text-xl font-semibold text-white">{{ title }}</h2>
      <p class="mt-1.5 text-sm text-white/55">{{ message }}</p>
    </div>
    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
      <div class="bg-white py-6 px-6 shadow-2xl rounded-2xl sm:px-10 border border-[#e5ebe6] text-center space-y-3">
        {% if code == 401 %}
        <a href="/auth/login" class="block w-full py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-[#1aae5c] hover:bg-[#159452] transition">Log in</a>
        {% else %}
        <a href="/dashboard" class="block w-full py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-[#1aae5c] hover:bg-[#159452] transition">Back to dashboard</a>
        {% endif %}
        <a href="/" class="block w-full py-2.5 px-4 rounded-xl text-sm font-semibold text-[#0f7a4d] border border-[#e5ebe6] hover:bg-[#f7f9f7] transition">Home</a>
      </div>
    </div>
  </div>
</body>
</html>
