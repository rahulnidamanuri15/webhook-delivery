{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block public_content %}
<div class="min-h-screen bg-slate-900 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <div class="inline-flex items-center justify-center p-3 bg-indigo-600 rounded-xl text-white shadow-lg mb-4">
      <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
      </svg>
    </div>
    <h2 class="text-3xl font-extrabold text-white">Create an Account</h2>
    <p class="mt-2 text-sm text-slate-400">Get started with resilient webhook infrastructure</p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-slate-800 py-8 px-6 shadow-xl rounded-2xl sm:px-10 border border-slate-700">
      
      {% if error %}
      <div class="mb-4 bg-red-950/80 border border-red-500 text-red-300 text-sm p-3 rounded-lg">
        {{ error }}
      </div>
      {% endif %}

      <form class="space-y-6" action="/auth/register" method="POST">
        <div>
          <label class="block text-sm font-medium text-slate-200">Email address</label>
          <input type="email" name="email" required autofocus placeholder="developer@example.com"
                 class="mt-1 block w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-200">Password</label>
          <input type="password" name="password" required minlength="8" placeholder="•••••••• (min 8 chars)"
                 class="mt-1 block w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-200">Initial Project Name</label>
          <input type="text" name="project_name" required value="Default Project"
                 class="mt-1 block w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm">
        </div>

        <div>
          <button type="submit"
                  class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition">
            Create Account & Organization
          </button>
        </div>
      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-slate-400">
          Already registered?
          <a href="/auth/login" class="font-medium text-indigo-400 hover:text-indigo-300">Sign in here</a>
        </p>
      </div>

    </div>
  </div>
</div>
{% endblock %}
