groups:
  - name: webhook-delivery
    interval: 30s
    rules:
      - alert: WebhookBacklogHigh
        expr: webhook_backlog_total > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Webhook delivery backlog > 1000 for 5m"
      - alert: WebhookDeadLetterSurge
        expr: increase(webhook_deliveries_total{status="DEAD"}[15m]) > 50
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DEAD deliveries surging (>50 in 15m)"
      - alert: EmailSendFailures
        expr: increase(webhook_email_send_total{result="failed"}[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Transactional email failures rising"
      # Backup freshness cannot be scraped from /metrics (db_backup is a sidecar).
      # Monitor via compose healthcheck (unhealthy after 48h without dump) plus
      # an external cron that checks ./backups age and offsite copy. Example:
      #   find ./backups -maxdepth 1 -name '*.gz' -mtime -1 | grep -q . || alert
      - alert: WebhookDispatchStalled
        expr: webhook_backlog_total > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Backlog not draining for 15m — check celery_beat / worker / Redis"
      - alert: WebhookUnexpectedErrors
        expr: increase(webhook_delivery_attempts_by_error{error_code="UNEXPECTED_ERROR"}[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Internal delivery errors rising (>5 in 15m) — check worker logs, not receivers"
      - alert: WebhookLeasesStuck
        expr: webhook_deliveries_total{status="IN_FLIGHT"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Many IN_FLIGHT >10m — check workers / recovery / Redis"
      # TLS cert expiry is checked out-of-band (no cert metric in /metrics).
      # Run scripts/check_cert_expiry.sh from cron and alert on non-zero exit:
      #   0 3 * * * /app/scripts/check_cert_expiry.sh --warn-days 14 || alert
