groups:
  - name: webhook-delivery
    interval: 30s
    rules:
      - alert: WebhookBacklogHigh
        expr: webhook_backlog_total > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Webhook delivery backlog > 1000 for 5m"
      - alert: WebhookDeadLetterSurge
        expr: increase(webhook_deliveries_total{status="DEAD"}[15m]) > 50
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DEAD deliveries surging (>50 in 15m)"
      - alert: EmailSendFailures
        expr: increase(webhook_email_send_total{result="failed"}[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Transactional email failures rising"
      # Backup freshness cannot be scraped from /metrics (db_backup is a sidecar).
      # Monitor via compose healthcheck (unhealthy after 48h without dump) plus
      # an external cron that checks ./backups age and offsite copy. Example:
      #   find ./backups -maxdepth 1 -name '*.gz' -mtime -1 | grep -q . || alert
      - alert: WebhookDispatchStalled
        expr: webhook_backlog_total > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Backlog not draining for 15m — check celery_beat / worker / Redis"
