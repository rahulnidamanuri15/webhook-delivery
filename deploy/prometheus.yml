# Prometheus scrape example for webhook-delivery prod.
# The app exposes /metrics on web:8080 (Bearer METRICS_API_KEY).
# Run alongside compose.prod.yaml, e.g.:
#   docker run -d --network webhook-delivery-prod_default \
#     -v ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml \
#     -v ./deploy/alerts.yml:/etc/prometheus/alerts.yml \
#     prom/prometheus --config.file=/etc/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: webhook-delivery
    metrics_path: /metrics
    static_configs:
      - targets: ['web:8080']
    authorization:
      credentials: ${METRICS_API_KEY}
    scrape_timeout: 10s
