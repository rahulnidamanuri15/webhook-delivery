# HTTP-only reverse proxy for Oracle Cloud Always Free first boot (no domain yet).
# ACME/preflight ONLY: serves /.well-known/acme-challenge/ (cert issuance),
# /ready and /healthz (preflight). Do NOT use it for dashboard registration or
# login: production sets Secure session/CSRF cookies, which browsers never send
# over plain HTTP, so login requires HTTPS. Create the first owner with
# scripts/bootstrap_admin.py, then switch to deploy/nginx.conf (TLS on :443)
# and sign in over HTTPS. Never weaken Secure cookie flags for HTTP onboarding.
# Usage (from repo root on the VM):
#   NGINX_CONF=./deploy/nginx.oracle-http.conf DEPLOY_PROD_ALLOW_MISSING_TLS=1 \
#     ./scripts/deploy_prod.sh up --build -d
# Once a domain points at the VM and Let's Encrypt certs are in deploy/tls/,
# redeploy WITHOUT the overrides to switch to deploy/nginx.conf (TLS on :443).
#
# NOTE: scripts/enforce_prod_compose.sh + tests require compose.prod.yaml to
# default to deploy/nginx.conf — this file is only ever selected via the
# NGINX_CONF override, never as the default.

server_tokens off;

upstream webhook_web {
    server web:8080;
    keepalive 32;
}

# Rate-limit zones (shared memory, survives reloads)
limit_req_zone $binary_remote_addr zone=ingest:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ACME challenge passthrough (used when you later issue certs via certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Local liveness probe for the compose healthcheck (never redirects).
    location = /healthz {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    # Throttle hot paths (auth + ingestion); dashboard polling is unthrottled.
    location /api/v1/events {
        limit_req zone=ingest burst=60 nodelay;
        limit_conn addr 20;
        proxy_pass http://webhook_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://webhook_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        limit_conn addr 50;
        proxy_pass http://webhook_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
