# Reverse proxy for single-host production deployment.
# Terminates TLS (mount certs at ./deploy/tls/) and forwards to FastAPI.
# HTTP on :80 serves ACME challenges; all other traffic redirects to HTTPS
# once the 443 server below is enabled. With compose.prod.yaml, :443 is
# exposed and ./deploy/tls is mounted read-only.
#
# Setup:
#   mkdir -p deploy/tls
#   # copy fullchain.pem + privkey.pem (e.g. Let's Encrypt) into deploy/tls/
#   docker compose -f compose.yaml -f compose.prod.yaml up --build

server_tokens off;

upstream webhook_web {
    server web:8080;
    keepalive 32;
}

# Rate-limit zones (shared memory, survives reloads)
limit_req_zone $binary_remote_addr zone=ingest:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# HTTP: ACME passthrough + redirect everything else to HTTPS.
server {
    listen 443 ssl;
    server_name hooks.yourdomain.com; # Replace with actual domain

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # When TLS is enabled (certs mounted), force HTTPS:
        # NOTE: keep this return active in prod. For HTTP-only local dev,
        # comment it out temporarily.
        return 301 https://$host$request_uri;
    }
}

# HTTPS: active in prod (compose.prod.yaml mounts ./deploy/tls).
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Throttle hot paths (auth + ingestion); dashboard polling is unthrottled.
    location /api/v1/events {
        limit_req zone=ingest burst=60 nodelay;
        limit_conn addr 20;
        proxy_pass http://webhook_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://webhook_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        limit_conn addr 50;
        proxy_pass http://webhook_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}
