# Reverse proxy for single-host production deployment.
# Terminates TLS (mount your certs) and forwards to the FastAPI web process.
# For local HTTP-only use, the 443 block can be removed; port 80 always works.
# Place certs at ./deploy/tls/fullchain.pem and ./deploy/tls/privkey.pem
# (e.g. from Let's Encrypt) and uncomment the 443 server block.

upstream webhook_web {
    server web:8080;
}

# HTTP: redirect to HTTPS when certs exist, else serve directly.
server {
    listen 80;
    server_name _;

    # ACME challenge passthrough (for certbot http-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # If TLS is enabled, uncomment the next line to force HTTPS:
        # return 301 https://$host$request_uri;
        proxy_pass http://webhook_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        # Hardening headers (also set on 443 block when enabled)
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
}

