# Dev-only reverse proxy: plain HTTP on :80, no TLS.
# Production uses deploy/nginx.conf (TLS + HTTPS redirect) via compose.prod.yaml.
server_tokens off;

upstream webhook_web {
    server web:8080;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=ingest:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/v1/events {
        limit_req zone=ingest burst=60 nodelay;
        proxy_pass http://webhook_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://webhook_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
}
